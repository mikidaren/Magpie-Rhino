name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: node --test tests/agent.test.mjs
      - run: dotnet run --project tests/Core.Tests --configuration Release
      - run: dotnet run --project tests/Agent.Tests --configuration Release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install.test.ps1
      - run: npm pack ./plugin --dry-run
  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - shell: pwsh
        run: |
          Invoke-WebRequest https://files.mcneel.com/yak/tools/0.19.1/win-x64/yak.exe -OutFile "$env:RUNNER_TEMP/yak.exe"
          ./scripts/build-panel.ps1 -YakPath "$env:RUNNER_TEMP/yak.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: RhinoMagpie-panel-win-x64
          path: |
            dist/RhinoMagpie-panel-win-x64.zip
            dist/*.yak
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RhinoMagpie-panel-win-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --generate-notes
