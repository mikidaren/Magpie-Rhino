name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: node --test tests/agent.test.mjs
      - run: dotnet run --project tests/Core.Tests --configuration Release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install.test.ps1
      - run: npm pack ./plugin --dry-run
  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish src/RhinoMagpie -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/launcher
      - shell: pwsh
        run: |
          Copy-Item scripts/install.ps1 dist/launcher/install.ps1
          Copy-Item README.md dist/launcher/README.md
          Copy-Item plugin dist/launcher/plugin -Recurse
          Compress-Archive -Path dist/launcher/RhinoMagpie.exe,dist/launcher/install.ps1,dist/launcher/README.md,dist/launcher/plugin -DestinationPath dist/RhinoMagpie-win-x64.zip
          Get-FileHash dist/RhinoMagpie-win-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  RhinoMagpie-win-x64.zip" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RhinoMagpie-win-x64
          path: |
            dist/RhinoMagpie-win-x64.zip
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RhinoMagpie-win-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --generate-notes
